<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>{{ site_name }}</title></head>
<body style="margin:0;padding:0;background:#f6f1e7;">
<div style="display:none;max-height:0;overflow:hidden;">{% block preheader %}{% endblock %}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f1e7;">
<tr><td align="center" style="padding:24px 12px;">
  <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;">
    <tr><td style="background:#1b1038;background-image:linear-gradient(135deg,#1b1038,#3a2370);border-radius:16px 16px 0 0;padding:26px 32px;text-align:center;">
      <a href="{{ base_url }}/" style="font-family:Georgia,'Times New Roman',serif;font-size:26px;color:#f3dfa2;text-decoration:none;letter-spacing:.5px;"><img src="{{ base_url }}/static/img/logo-128.png" width="56" height="56" alt="" style="display:block;margin:0 auto 8px;border:0;">{{ site_name }}</a>
      {% block banner %}{% endblock %}
    </td></tr>
    <tr><td style="background:#ffffff;padding:30px 32px;border-radius:0 0 16px 16px;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;color:#2a2340;">
      {% block body %}{% endblock %}
    </td></tr>
    <tr><td style="padding:18px 24px;text-align:center;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#7a7290;">
      {% block footer %}{% endblock %}
      <p style="margin:6px 0 0;">{{ site_name }} is operated by TAPNET. Free numerology reports based on the Pythagorean system, for reflection and entertainment.</p>
    </td></tr>
  </table>
</td></tr>
</table>
</body>
</html>
