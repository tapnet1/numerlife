name: Deploy numer.life Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: numerlife-production
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.tested.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Record the tested commit
        id: tested
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Install SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          test -n "$DEPLOY_SSH_KEY"
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/numerlife_deploy_key
          chmod 600 ~/.ssh/numerlife_deploy_key
          ssh-keygen -y -f ~/.ssh/numerlife_deploy_key >/dev/null
          printf '%s\n' '[server2.tapnet.com]:21098 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE/D6L7nbgrtTZPh1FN/DY9qGjX/TA20EgYrsLx3S/A5' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy the tested commit, back up and initialize database, restart Passenger
        shell: bash
        env:
          TESTED_SHA: ${{ needs.tests.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Missing tested commit"; exit 1; }
          ssh -i ~/.ssh/numerlife_deploy_key -p 21098 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            numerlife1@server2.tapnet.com "bash -s -- $TESTED_SHA" <<'REMOTE'
          set -euo pipefail
          tested_sha="$1"
          cd /home/numerlife1/numerlife
          test "$(git branch --show-current)" = "main"
          test -f passenger_wsgi.py
          test -f .env
          test -z "$(git status --porcelain --untracked-files=no)"
          # Required settings: fail on the essentials, warn on the rest. Values are never printed.
          env_value() { grep -m1 "^$1=" .env | cut -d= -f2- || true; }
          grep -q "^NUMER_DB=." .env || { echo "::error::NUMER_DB is missing from .env"; exit 1; }
          secret="$(env_value NUMER_SECRET_KEY)"
          if [ "${#secret}" -lt 32 ] || [ "$secret" = "change-me" ]; then
            echo "::error::NUMER_SECRET_KEY must be a random value of at least 32 characters"
            exit 1
          fi
          unset secret
          case "$(env_value NUMER_BASE_URL)" in
            https://[A-Za-z0-9]*.[A-Za-z]*) ;;
            *) echo "::error::NUMER_BASE_URL must be set to the site's https:// address"; exit 1 ;;
          esac
          for key in NUMER_CREDENTIAL_KEY NUMER_NOINDEX; do
            grep -q "^${key}=." .env || echo "::warning::${key} is missing from .env"
          done
          git fetch origin main
          # Deploy exactly the commit that passed the tests. If main moved on since,
          # stop: run the workflow again so the newer commit is tested first.
          if [ "$(git rev-parse origin/main)" != "$tested_sha" ]; then
            echo "::error::main changed after the tests ran; re-run the deploy"
            exit 1
          fi
          git merge --ff-only "$tested_sha"
          # A local commit ahead of origin/main would make the merge a no-op; insist on exact.
          if [ "$(git rev-parse HEAD)" != "$tested_sha" ]; then
            echo "::error::Server is not on the tested commit (local changes on main?); fix the server checkout"
            exit 1
          fi
          echo "Deployed commit: $tested_sha"
          # Install/upgrade dependencies before any application module is imported.
          test -x .venv/bin/python
          .venv/bin/python -m pip install --disable-pip-version-check --quiet -r requirements.txt
          .venv/bin/python -c "import flask, cryptography, segno, PIL; print('Dependencies verified')"
          # Push notifications: create the VAPID key once, on the server only. It never leaves .env;
          # rotating it would mean every device has to turn notifications on again.
          if ! grep -q '^NUMER_VAPID_PRIVATE_KEY=.' .env; then
            vapid="$(.venv/bin/python webpush.py generate)"
            (umask 077; printf '\nNUMER_VAPID_PRIVATE_KEY=%s\n' "$vapid" >> .env)
            unset vapid
            echo "Push notification key created in .env"
          fi
          # Load .env through the Passenger entry point, back up the SQLite database with
          # the online backup API, then create missing tables.
          .venv/bin/python - <<'PY'
          import datetime
          import sqlite3
          from pathlib import Path
          import passenger_wsgi  # noqa: F401  (loads .env, imports the app)
          from app import DB, REQUIRED_TABLES, initialize

          db_path = Path(DB)
          if db_path.exists() and db_path.stat().st_size:
              stamp = datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%dT%H%M%SZ")
              backup_path = db_path.with_name(f"{db_path.name}.{stamp}.bak")
              source = sqlite3.connect(str(db_path))
              backup = sqlite3.connect(str(backup_path))
              try:
                  source.backup(backup)
              finally:
                  backup.close()
                  source.close()
              backup_path.chmod(0o600)
              print(f"Database backup created: {backup_path.name}")
          initialize()
          connection = sqlite3.connect(str(db_path))
          try:
              existing = {row[0] for row in connection.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          finally:
              connection.close()
          missing = REQUIRED_TABLES - existing
          if missing:
              raise RuntimeError(f"Database initialization missing tables: {sorted(missing)}")
          print("Database initialized and required tables verified")
          import webpush
          print("Push notifications: configured" if webpush.public_key() else "::warning::Push key missing")
          import secretbox
          try:
              secretbox.check_key()
              print("Credential encryption key: configured")
          except secretbox.CredentialKeyError as exc:
              print(f"::warning::{exc}; saving third-party credentials will fail until it is fixed")
          PY
          # Background jobs, installed in a marked crontab block so re-running stays idempotent.
          mkdir -p tmp logs && chmod 700 logs
          purge_job='23 * * * * cd /home/numerlife1/numerlife && .venv/bin/python jobs.py purge-attempts >> logs/jobs.log 2>&1'
          push_job='* * * * * cd /home/numerlife1/numerlife && .venv/bin/python jobs.py send-push >> logs/jobs.log 2>&1'
          if command -v crontab >/dev/null; then
            { crontab -l 2>/dev/null | sed '/# numerlife-jobs begin/,/# numerlife-jobs end/d'
              printf '%s\n' '# numerlife-jobs begin' "$purge_job" "$push_job" '# numerlife-jobs end'
            } | crontab - && echo "Scheduled jobs installed" \
              || echo "::warning::Could not install cron jobs; add them in cPanel > Cron Jobs"
          else
            echo "::warning::crontab not available; add the jobs in cPanel > Cron Jobs"
          fi
          touch tmp/restart.txt
          echo "Passenger restart requested"
          REMOTE

      - name: Verify application endpoints
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in health login static/css/app.css ""; do
            passed=0
            for attempt in 1 2 3 4 5; do
              code="$(curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' "https://numer.life/$endpoint" || true)"
              echo "/$endpoint: HTTP $code (attempt $attempt)"
              if [ "$code" = "200" ]; then
                passed=1
                break
              fi
              sleep 5
            done
            test "$passed" -eq 1 || { echo "::error::/$endpoint did not return HTTP 200"; exit 1; }
          done
          # Unauthenticated admin access must redirect to sign in, not error (retried like the others).
          admin_ok=0
          for attempt in 1 2 3 4 5; do
            admin_code="$(curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' https://numer.life/admin || true)"
            echo "/admin (signed out): HTTP $admin_code (attempt $attempt)"
            if [ "$admin_code" = "302" ]; then admin_ok=1; break; fi
            sleep 5
          done
          test "$admin_ok" -eq 1 || { echo "::error::/admin did not redirect to sign in"; exit 1; }

      - name: Remove temporary SSH key
        if: always()
        run: rm -f ~/.ssh/numerlife_deploy_key ~/.ssh/known_hosts
