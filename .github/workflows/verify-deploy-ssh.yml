   name: Verify Production SSH Key

   # Manual, read-only check: confirms the DEPLOY_SSH_KEY environment secret parses,
   # authenticates to the server, and that the server-side setup the deploy relies on
   # is in place. It never changes anything on the server.

   on:
     workflow_dispatch:

   permissions:
     contents: read

   jobs:
     verify:
       runs-on: ubuntu-latest
       environment: production
       timeout-minutes: 5
       steps:
         - name: Validate key, authenticate and check server setup (no deployment)
           env:
             DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
           shell: bash
           run: |
             set -euo pipefail
             umask 077
             mkdir -p ~/.ssh
             trap 'rm -f ~/.ssh/numerlife_deploy_key ~/.ssh/known_hosts' EXIT
             if [ -z "$DEPLOY_SSH_KEY" ]; then
               echo "::error::DEPLOY_SSH_KEY environment secret is missing"
               exit 1
             fi
             printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/numerlife_deploy_key
             chmod 600 ~/.ssh/numerlife_deploy_key
             ssh-keygen -y -f ~/.ssh/numerlife_deploy_key >/dev/null || {
               echo "::error::Private key could not be parsed. Check its formatting in the environment secret."
               exit 1
             }
             echo "Private key format: valid"
             # Pinned server host key (same server as Strategy Capital).
             printf '%s\n' '[server2.tapnet.com]:21098 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIE/D6L7nbgrtTZPh1FN/DY9qGjX/TA20EgYrsLx3S/A5' > ~/.ssh/known_hosts
             chmod 600 ~/.ssh/known_hosts
             ssh -i ~/.ssh/numerlife_deploy_key -p 21098 \
               -o BatchMode=yes -o IdentitiesOnly=yes \
               -o StrictHostKeyChecking=yes -o ConnectTimeout=12 \
               numerlife1@server2.tapnet.com 'bash -se' <<'REMOTE'
             set -euo pipefail
             echo "Authenticated as: $(whoami)"
             cd /home/numerlife1/numerlife
             test "$(git branch --show-current)" = "main" && echo "Branch: main"
             test -x .venv/bin/python && echo "Virtualenv: $(.venv/bin/python --version)"
             test -f .env && echo ".env: present"
             test -f passenger_wsgi.py && echo "passenger_wsgi.py: present"
             git fetch --dry-run origin main && echo "Server can fetch from GitHub: yes"
             REMOTE
